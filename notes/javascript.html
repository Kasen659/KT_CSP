            function change(){
                if(img_count > imgs.length){
                    img_count = 0
                }else{
                    img_count += 1
                }
                document.getElementById("timp").scr = imgs[img_count]
            }
            function color_change(){
                document. getElementById("Shift").style.color = document.getElementById
                ('selected_color')>value
            }
            function add(){
                count += 1
                document.getElementById('number').innerHTML = count
            }
            function hover(id){
                document.getElementById(id).style.backgroundColor = "red"
                document.getElementById(id).style.color = "white"
            }
            function unhover (id){
                document.getElementById(id).style.backgroundColor = "lightgray"
                document.getElementById(id).style.color = "black"
            }
            function popup(){
                alert("This is about javascript")
            }
            function show(){
                if(document.getElementById("timp").style.display == "block"){
                    document.getElementById("timp").style.display = "none"
                }else{
                  document.getElementById("timp").style.display = "block"  
                }
            
            </script>
    </head>
    <body>
        <h1 id="Shift" onclick="popup()">Java notes</h1>
        <input type="color" id="selected_color">
        <button onclick="color_change()" onmouseover="hover('one')" onmouseout="unhover('one')" id = "one">change the color</button>
        <p id="number"onmouseover="show()">0</p>
        <button onclick="add()" onmouseover="hover('two')" onmouseout="unhover('two')" id = "two">increase</button>
        <img id="timp" alt="mouse" scr="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT6bj4wkpIYDTUEiVI2f670l0qw-qtgSywn3A&s" onmouseover="change()">
    </body>
